<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte - Wayra Kawsay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="acceso.css">
    <link rel="stylesheet" href="transporte.css">
    <!-- Estilos del mapa Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>
    <!-- Banner -->
    <header class="hero-banner">
        <img src="imagenes/Bannerw.png" alt="Wayra Kawsay - Turismo Nariño" class="banner-img">
    </header>

    <!-- Barra de navegacion -->
    <nav class="navbar">
        <div class="hojas-decorativas hojas-izquierda" aria-hidden="true">
            <span>🌿</span>
        </div>

        <div class="hojas-decorativas hojas-derecha" aria-hidden="true">
            <span>🌿</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="destinos.html">Destinos</a></li>
            <li><a href="eventos.html">Eventos</a></li>
            <li><a href="historia.html">Historia</a></li>
            <li><a href="transporte.html" class="active">Transporte</a></li>
        </ul>


        <div class="nav-user">
            <!-- Botón de acceso -->
            <button type="button" class="user-icon-btn" id="abrir-acceso" title="Ingresar o ver perfil"
                aria-label="Ingresar o ver perfil">

                <span class="icono-usuario" id="avatar-menu">
                    👤
                </span>

                <!-- Flecha independiente del menú del perfil -->
                <button type="button" class="flecha-perfil" id="abrir-menu-perfil" title="Abrir menú del perfil"
                    aria-label="Abrir menú del perfil" aria-expanded="false" aria-controls="menu-perfil" hidden>
                    ⌄
                </button>

                <!-- Menú del perfil -->
                <div id="menu-perfil" class="menu-perfil" hidden>
                    <div class="menu-perfil-cabecera">
                        <p id="nombre-menu-perfil" class="menu-perfil-nombre">Mi perfil</p>
                        <p class="menu-perfil-subtitulo">Tu espacio en Wayra Kawsay</p>
                    </div>


                    <button type="button" class="menu-perfil-opcion" data-opcion="eventos-favoritos">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="16" rx="2" />
                            <path d="M16 3v4M8 3v4M3 10h18" />
                            <path d="m12 18-2.2-2.1a1.5 1.5 0 0 1 2.2-2 1.5 1.5 0 0 1 2.2 2Z" />
                        </svg>
                        <span>Eventos favoritos</span>
                    </button>

                    <button type="button" class="menu-perfil-opcion" data-opcion="destinos-favoritos">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" />
                            <circle cx="12" cy="10" r="2.5" />
                        </svg>
                        <span>Destinos favoritos</span>
                    </button>

                    <button type="button" class="menu-perfil-opcion" data-opcion="cronograma">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="16" rx="2" />
                            <path d="M16 3v4M8 3v4M3 10h18M8 14h3M8 17h7" />
                        </svg>
                        <span>Mi cronograma</span>
                    </button>

                    <button type="button" class="menu-perfil-opcion" data-opcion="editar-perfil">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="10" cy="8" r="4" />
                            <path d="M3 21v-2a7 7 0 0 1 12-4.9M15 19l5-5 2 2-5 5-3 1Z" />
                        </svg>
                        <span>Editar perfil</span>
                    </button>

                    <button type="button" class="menu-perfil-opcion menu-perfil-cerrar" data-opcion="cerrar-sesion">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M10 17l5-5-5-5M15 12H3" />
                            <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7" />
                        </svg>
                        <span>Cerrar sesión</span>
                    </button>

                    <p id="mensaje-menu-perfil" class="menu-perfil-mensaje" hidden></p>
                </div>
        </div>

    </nav>



    <!-- Contenido principal de Transporte -->
    <main class="contenido-transporte">

        <section class="presentacion-transporte">
            <h1>Explora Nariño a tu manera</h1>

            <p>
                Encuentra cómo llegar a los lugares que deseas descubrir
                y comienza tu recorrido.
            </p>
        </section>

        <!-- Vista previa del mapa -->
        <section class="seccion-mapa">

            <button type="button" class="vista-previa-mapa" id="abrir-mapa" aria-label="Abrir mapa interactivo">

                <span class="icono-mapa">📍</span>

                <span class="titulo-mapa">Explora el mapa de Nariño</span>

                <span class="texto-mapa">
                    Haz clic para consultar recorridos y descubrir cómo llegar
                    a tu próximo destino.
                </span>

                <span class="accion-mapa">
                    Abrir mapa <span aria-hidden="true">↗</span>
                </span>

            </button>

        </section>

    </main>



    <!-- Ventana ampliada del mapa -->
    <div class="ventana-mapa" id="ventana-mapa" hidden>

        <!-- Panel lateral izquierdo -->
        <aside class="panel-recorrido">

            <div class="encabezado-recorrido">
                <h2>Tu recorrido</h2>

                <button type="button" id="cerrar-mapa" aria-label="Cerrar mapa">
                    ✕
                </button>
            </div>

            <form id="formulario-recorrido">

                <label for="origen">Punto de partida</label>
                <input type="text" id="origen" placeholder="¿Desde dónde sales?" required>

                
<label for="destino">Destino</label>

<div class="contenedor-destino">

    <input
        type="text"
        id="destino"
        placeholder="Selecciona o escribe un destino"
        autocomplete="off"
        required
    >

    <button
        type="button"
        id="abrir-destinos"
        class="boton-desplegar-destinos"
        aria-label="Mostrar destinos"
    >
        ▼
    </button>

    <div id="lista-destinos" class="lista-destinos" hidden>

        <button type="button" data-destino="Laguna de La Cocha">
            Laguna de La Cocha
        </button>

        <button type="button" data-destino="Santuario de Las Lajas">
            Santuario de Las Lajas
        </button>

        <button type="button" data-destino="Volcán Galeras">
            Volcán Galeras
        </button>

        <button type="button" data-destino="Playas de Tumaco - El Morro">
            Playas de Tumaco - El Morro
        </button>

        <button type="button" data-destino="Museo del Oro">
            Museo del Oro
        </button>

        <button type="button" data-destino="Gradas de Belén">
            Gradas de Belén
        </button>

        <button type="button" data-destino="Laguna de la Cruz - Tajumbina">
            Laguna de la Cruz - Tajumbina
        </button>

        <button type="button" data-destino="Katza-Pi">
            Katza-Pi
        </button>

    </div>

</div>

                <button type="button" id="usar-ubicacion">
                    📍 Usar mi ubicación actual
                </button>

                <button type="submit" id="buscar-recorrido">
                    Buscar recorrido
                </button>

            </form>

            <div id="informacion-recorrido" aria-live="polite">
                <p>Tu distancia y duración estimada aparecerán aquí.</p>
            </div>

        </aside>

        <!-- Área del mapa -->
        <section class="area-mapa">
            <div id="mapa"></div>
        </section>

    </div>



   <!-- Biblioteca Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- JavaScript de nuestra sección -->
<script src="transporte.js"></script>
</body>

</html>
