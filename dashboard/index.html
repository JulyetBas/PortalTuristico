<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alma Nariñense - Portal Turístico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Banner Principal con Logos/Imágenes representativas -->
    <header class="main-banner">
        <div class="banner-content">
            <div class="banner-logo-left">
                <!-- Aquí puedes poner tu imagen o icono del oso/fauna -->
            </div>
            <h1>ALMA NARIÑENSE</h1>
            <div class="banner-logo-right">
                <!-- Aquí puedes poner la imagen de Las Lajas -->
            </div>
        </div>
    </header>

    <!-- Barra de Navegación -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#" class="active">Inicio</a></li>
            <li><a href="#">Destinos</a></li>
            <li><a href="#">Eventos</a></li>
            <li><a href="#">Gastronomía</a></li>
        </ul>
        <div class="nav-auth">
            <!-- Más adelante ajustaremos esto al icono de usuario que prefieres -->
            <button class="btn-login">Iniciar Sesión</button>
            <button class="btn-register">Registrarse</button>
        </div>
    </nav>

    <!-- Frase Motivacional -->
    <section class="hero-quote">
        <p>Descubre la magia y cultura del sur de Colombia</p>
    </section>

    <!-- Sección de Destinos Destacados (Inicio) -->
    <main class="content-container">
        <h2>Destinos Destacados</h2>
        <div class="destinos-grid">
            <!-- Aquí irán las tarjetas de La Cocha, Las Lajas, Ipiales, etc. -->
            <div class="card-destino">
                <h3>Santuario de Las Lajas</h3>
                <p>Ipiales, Nariño</p>
            </div>
            <div class="card-destino">
                <h3>Laguna de La Cocha</h3>
                <p>El Encano, Pasto</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
