<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayra Kawsay - Turismo Nariño</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Banner Principal Adaptado a Todo el Ancho -->
    <header class="hero-banner">
        <img src="imagenes/Bannerw.png" alt="Wayra Kawsay - Turismo Nariño" class="banner-img">
    </header>

    <!-- Barra de Navegación -->
    <nav class="navbar">
        <div class="hojas-decorativas hojas-izquierda" aria-hidden="true">
    <span>🌿</span>
</div>

<div class="hojas-decorativas hojas-derecha" aria-hidden="true">
    <span>🌿</span>
</div>
        <ul class="nav-links">
            <li><a href="#" class="active">Inicio</a></li>
            <li><a href="#">Destinos</a></li>
            <li><a href="#">Eventos</a></li>
            <li><a href="#">Gastronomía</a></li>
        </ul>
        <div class="nav-user">
            <button class="user-icon-btn" title="Perfil / Ingresar">👤</button>
        </div>
    </nav>
  <!-- BIENVENIDA DE INICIO: ESTO ES LO NUEVO -->
    <section class="bienvenida-inicio">

        <p class="bienvenida-etiqueta">
            BIENVENIDO A NARIÑO
        </p>

        <h1>
            Nariño, donde cada paisaje cuenta una historia
        </h1>

        <p class="bienvenida-descripcion">
            Descubre lugares extraordinarios, tradiciones vivas
            y la riqueza cultural del sur de Colombia.
        </p>

    </section>
    <!-- Contenido Principal -->

<!-- Carrusel principal de fotografías -->
<main class="galeria-inicio">
    <section class="carrusel" aria-label="Paisajes de Nariño">

        <div class="carrusel-imagenes">

            <div class="foto-slide activa">
                <img src="imagenes/lajas.jpg"
                     alt="Santuario de Las Lajas">
            </div>

            <div class="foto-slide">
                <img src="imagenes/cochaa.jpg"
                     alt="Laguna de La Cocha">
            </div>

            <div class="foto-slide">
                <img src="imagenes/tumaco.jpg"
                     alt="Paisaje de Tumaco">
            </div>

            <div class="foto-slide">
                <img src="imagenes/verde.jpg"
                     alt="Paisaje verde de Nariño">
            </div>

        </div>

        <button class="flecha anterior"
                type="button"
                aria-label="Fotografía anterior">&#10094;</button>

        <button class="flecha siguiente"
                type="button"
                aria-label="Fotografía siguiente">&#10095;</button>

        <div class="puntos-carrusel">
            <button class="punto activo" aria-label="Mostrar Las Lajas"></button>
            <button class="punto" aria-label="Mostrar La Cocha"></button>
            <button class="punto" aria-label="Mostrar Tumaco"></button>
            <button class="punto" aria-label="Mostrar paisaje verde"></button>
        </div>

    </section>
</main>
    <script src="script.js"></script>
</body>
</html>
